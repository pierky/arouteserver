# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.14"

formats:
  - epub

sphinx:
  configuration: docs/conf.py

# The project and its runtime dependencies are installed from uv.lock,
# together with the 'docs' group and the default 'dev' one (the code
# documentation imports the live tests modules, which need requests-mock).
python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
