name: Test external resources

on:
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron:  '16 9 * * *'
  workflow_dispatch:

jobs:
  test_ext_res:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install bgpq3 / bgpq4
        run: |
          ./tests/external_resources/install_bgpq3.sh
          ./tests/external_resources/install_bgpq4.sh

      - name: Install dependencies
        run: |
          uv sync --locked --group dev --python "${{ steps.setup-python.outputs.python-path }}"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Test external resources
        run: pytest -vs tests/external_resources
        env:
          TRAVIS: 1
          SECRET_PEERINGDB_API_KEY: ${{ secrets.SECRET_PEERINGDB_API_KEY }}
