cfg:
  rs_as: 999
  router_id: "192.0.2.2"
  filtering:
    irrdb:
      enforce_origin_in_as_set: False
      enforce_prefix_in_as_set: False
      tag_as_set: False
    rpki_bgp_origin_validation:
      enabled: True
      reject_invalid: False
    rpki_aspa_verification:
      enabled: True
      reject_invalid: False
    # ASPA verification on OpenBGPD is performed only on sessions
    # for which a role is set.
    roles:
      enabled: True
  rpki_roas:
    source: "ripe-rpki-validator-cache"
    allowed_trust_anchors:
      - "test"
  rpki_aspas:
    # Same file used for the ROAs above: it's fetched only once.
    source: "json"
    allowed_trust_anchors:
      - "test"
  communities:
    rpki_bgp_origin_validation_valid:
      std: "64512:1"
    rpki_bgp_origin_validation_invalid:
      std: "64512:2"
    rpki_bgp_origin_validation_unknown:
      std: "64512:3"
    rpki_aspa_verification_valid:
      std: "64512:4"
    rpki_aspa_verification_invalid:
      std: "64512:5"
    rpki_aspa_verification_unknown:
      std: "64512:6"
