}




# ---------------------------------------------------------
# MEMBERS

group "clients" {

	neighbor 2001:db8:1:1::11 {
		remote-as 1

		rde evaluate all

		descr "AS1_1 client"
		passive
		ttl-security no
		reject as-set yes
		transparent-as yes
		enforce neighbor-as no


		announce as-4byte yes
		announce IPv6 unicast
		announce IPv4 unicast
		announce extended nexthop yes

		set nexthop no-modify
	}

	neighbor 2001:db8:1:1::12 {
		remote-as 1

		rde evaluate all

		descr "AS1_2 client"
		passive
		ttl-security no
		reject as-set yes
		transparent-as yes
		enforce neighbor-as no


		announce as-4byte yes
		announce IPv6 unicast
		announce IPv4 unicast
		announce extended nexthop yes

		set nexthop no-modify
	}

	neighbor 2001:db8:1:1::21 {
		remote-as 2

		rde evaluate all

		descr "AS2_1 client"
		passive
		ttl-security no
		reject as-set yes
		transparent-as yes
		enforce neighbor-as no


		announce as-4byte yes
		announce IPv6 unicast
		announce IPv4 unicast
		announce extended nexthop yes

		set nexthop no-modify
	}
}



