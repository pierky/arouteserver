# RTRTR configuration used by the live tests to serve a predictable
# set of RPKI ROAs and ASPAs over the RTR protocol.
#
# The 'json' unit reads the very same RIPE RPKI Validator format that
# ARouteServer consumes when 'rpki_roas.source'/'rpki_aspas.source'
# are set to fetch data from a JSON file, and the 'rtr' target serves
# it over version 2 of the RTR protocol (the only one that carries
# ASPA payloads).

log_level = "debug"
log_target = "stderr"
http-listen = []

[units.json]
type = "json"
uri = "file:/etc/rtrtr/rpki.json"
refresh = 10

[targets.rtr]
type = "rtr"
listen = [ "0.0.0.0:3323" ]
unit = "json"
