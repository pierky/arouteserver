cfg:
  rs_as: 999

  router_id: "192.0.2.2"

  filtering:

    irrdb:
      enforce_origin_in_as_set: False
      enforce_prefix_in_as_set: False

    rpki_bgp_origin_validation:
      enabled: True
      reject_invalid: True

    rpki_aspa_verification:
      enabled: True
      reject_invalid: True

    # ASPA verification on OpenBGPD is performed only on sessions
    # for which a role is set, so RFC9234 roles must be enabled too.
    roles:
      enabled: True

  rpki_roas:
    source: "rtr"

  rpki_aspas:
    source: "rtr"
